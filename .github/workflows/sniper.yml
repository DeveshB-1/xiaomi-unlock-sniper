name: Xiaomi Unlock Auto Sniper

on:
  schedule:
    # 15:50 UTC = 21:20 IST (wakes up 10 mins early to handle any GitHub queue delay)
    - cron: '50 15 * * *'
  workflow_dispatch:

jobs:
  snipe:
    name: Execute Unlock Sniper
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Auto-Sniper (Syncs & bursts at 21:30:00 IST)
        run: |
          python unlock_sniper.py --snipe
