name: Xiaomi Unlock Auto Sniper

on:
  schedule:
    # 15:50 UTC = 21:20 IST (wakes up 10 mins early for precision countdown)
    - cron: '50 15 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - snipe

jobs:
  snipe:
    name: Execute Unlock Sniper
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Sniper
        env:
          SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
          DEVICE_ID: ${{ secrets.DEVICE_ID }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "snipe" ]; then
            python unlock_sniper.py --snipe
          else
            python unlock_sniper.py --test
          fi
